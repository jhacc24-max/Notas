name: Publicar PWA (GitHub Pages, HTTPS)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar sitio estático (sin server/ ni tests/)
        run: |
          mkdir dist
          cp -r index.html manifest.webmanifest sw.js css js icons dist/
          rm -f dist/icons/*.svg.bak
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
